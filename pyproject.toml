[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-sniffer"
version = "0.1.0"
description = "Advanced packet sniffer for security analysis"
readme = "README.md"
authors = [
    {name = "Adel Kamel", email = "your-email@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = [
    "scapy>=2.5.0",
    "colorama>=0.4.6",
]
requires-python = ">=3.8"

[project.scripts]
packet-sniffer = "packet_sniffer.sniffer:main"