[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packet-sniffer"
version = "0.1.0"
description = "A lightweight, real-time packet sniffer for network security analysis"
readme = "README.md"
authors = [
    {name = "Adel Kamel", email = "adelkamel@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "scapy>=2.5.0",
    "colorama>=0.4.6",
]
requires-python = ">=3.8"

[project.scripts]
packet-sniffer = "packet_sniffer.sniffer:main"

[project.urls]
Homepage = "https://github.com/adelkamell/Packet-Sniffer"
Repository = "https://github.com/adelkamell/Packet-Sniffer"
Issues = "https://github.com/adelkamell/Packet-Sniffer/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"